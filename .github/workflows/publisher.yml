name: Auto Publisher Bot

on:
  schedule:
    # Chạy vào 0h, 4h, 8h, 12h, 16h, 20h (Mỗi 4 tiếng)
    - cron: '0 */4 * * *' 
  workflow_dispatch: # Để Sếp bấm chạy tay nếu muốn

jobs:
  publish-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm install
      - run: npx prisma generate
      - name: Publish One Draft
        # Chạy script tìm 1 bài Draft cũ nhất chuyển thành Published
        run: node scripts/publish-one.js 
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}